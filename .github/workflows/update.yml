name: Update results

on:
  schedule:
    # Every hour from 12:15 to 23:15 UTC (14:15-01:15 SAST), so each draw lands soon after it's published:
    # UK49s Lunchtime 12:49 UK time, Teatime 17:49 UK time, SA draws about 21:00 SAST.
    # One early-morning run catches anything the results sites posted late.
    - cron: "15 12-23 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new draws
        run: python update.py
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet data.json; then echo "No new draws"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Add new draws $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: update
    # republish only when there's a new draw, or when the app itself changed (push / manual run)
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: mkdir _site && cp index.html data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
